<div class="container mt-5">

    <h2>Edit News</h2>

    <form (ngSubmit)="updateNews()">

        <div class="mb-3">
            <label>Title</label>
            <input
                type="text"
                class="form-control"
                [(ngModel)]="news.title"
                name="title">
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea
                class="form-control"
                [(ngModel)]="news.description"
                name="description"></textarea>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input
                type="text"
                class="form-control"
                [(ngModel)]="news.category"
                name="category">
        </div>

        <div class="mb-3">
            <label>Location</label>
            <input
                type="text"
                class="form-control"
                [(ngModel)]="news.location"
                name="location">
        </div>

        <button class="btn btn-success">
            Update News
        </button>

    </form>

</div>
