<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">
      <h3>Add Village News</h3>
    </div>

    <div class="card-body">

      <form (ngSubmit)="submitNews()">

        <div class="mb-3">
          <label>Title</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="news.title"
            name="title"
            required>
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea
            class="form-control"
            rows="5"
            [(ngModel)]="news.description"
            name="description"
            required>
          </textarea>
        </div>

        <div class="mb-3">
          <label>Category</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="news.category"
            name="category">
        </div>

        <div class="mb-3">
          <label>Location</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="news.location"
            name="location">
        </div>
        <div class="mb-3">
    <label class="form-label">News Image</label>

    <input
        type="file"
        class="form-control"
        (change)="onFileSelected($event)">
</div>

        <button class="btn btn-success">
          Submit News
        </button>

      </form>

    </div>

  </div>

</div>
