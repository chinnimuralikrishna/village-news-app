<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="fw-bold text-dark mb-0">My Submitted News</h2>
  </div>

  <!-- Raw JSON Output for fast debugging -->
  

  <!-- News Items list -->
  <div class="row g-3" *ngIf="news && news.length > 0; else noData">
    <div class="col-12" *ngFor="let item of news">
      <div class="card shadow-sm border-0">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="fw-bold mb-1">{{ item.title }}</h5>
            <p class="text-secondary small mb-2">{{ item.description }}</p>
            <span class="badge bg-light text-dark border me-2">{{ item.category }}</span>
            <small class="text-muted"><i class="bi bi-geo-alt"></i> {{ item.location }}</small>
          </div>
          <div>
            <!-- Status Badge -->
            <span 
              class="badge rounded-pill px-3 py-2"
              [ngClass]="{
                'bg-success': item.status === 'approved',
                'bg-warning text-dark': item.status === 'pending',
                'bg-danger': item.status === 'rejected'
              }">
              {{ item.status | titlecase }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noData>
    <div class="alert alert-info text-center my-4">
      No news submitted yet or unable to fetch news items.
    </div>
  </ng-template>

</div>
