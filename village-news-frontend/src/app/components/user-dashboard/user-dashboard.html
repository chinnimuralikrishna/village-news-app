<div class="container mt-4">

    <div class="d-flex justify-content-between mb-4">

        <button class="btn btn-success" routerLink="/add-news">
            <i class="bi bi-plus-circle"></i>
            Add News
        </button>

        <button class="btn btn-primary" (click)="loadNews()">
            <i class="bi bi-arrow-clockwise"></i>
            Refresh
        </button>

        <button class="btn btn-warning" routerLink="/my-news">
            <i class="bi bi-newspaper"></i>
            My News
        </button>

    </div>

    <div class="row">

        <div class="col-lg-6 col-xl-4 mb-4" *ngFor="let item of news">

            <div class="card news-card shadow">

                <!-- News Image -->

               <img
    [src]="'http://127.0.0.1:5000/uploads/' + item.image"
    class="card-img-top"
    alt="News Image">

                <div class="card-body">

                    <span class="badge bg-success mb-2">

                        {{item.category}}

                    </span>

                    <h4 class="fw-bold">

                        {{item.title}}

                    </h4>

                    <p class="text-muted">

                        {{item.description}}

                    </p>

                    <div class="mt-3">

                        <small>

                            <i class="bi bi-geo-alt-fill text-danger"></i>

                            {{item.location}}

                        </small>

                    </div>

                </div>

                <div class="card-footer bg-white">

                    <div class="d-flex justify-content-around">

                       <button
    class="btn btn-light"
    (click)="likeNews(item.id)">

    <i class="bi bi-heart-fill text-danger"></i>

    {{ item.likes || 0 }}

</button>

                        <button class="btn btn-light">

                            <i class="bi bi-chat"></i>

                            Comment

                        </button>

                        <button class="btn btn-light">

                            <i class="bi bi-share"></i>

                            Share

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
