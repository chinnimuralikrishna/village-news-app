<div class="login-container">

  <div class="login-card">

    <h2>Village News Login</h2>

    <form>

      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          class="form-control"
          placeholder="Enter your email"
          [(ngModel)]="email"
          name="email">
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password">
      </div>

      <button
        class="btn btn-success w-100"
        type="button"
        (click)="login()">
        Login
      </button>

    </form>

  </div>

</div>
